<form [formGroup]="originForm">
  <div class="flex flex-col gap-4">
    <div class="grid">
      <div class="flex flex-col gap-2">
        <label for="origin">Selecciona el origen (*)</label>
        <p-select [filter]="true"
                  [options]="headquarters"
                  appendTo="body"
                  class="w-full md:w-full"
                  filterBy="headquarter_name"
                  formControlName="origin"
                  id="origin"
                  inputId="origin"
                  optionLabel="headquarter_name"
                  optionValue="headquarter_id"
                  placeholder="Selecciona el origen"
        />
      </div>
    </div>

    <div class="grid w-full">
      <p-button label="Siguiente" severity="primary" styleClass="w-full"
                (click)="handleSubmitOrigin()"
                (keydown.enter)="handleSubmitOrigin()"
                [disabled]="originForm.invalid" />
    </div>
  </div>
</form>

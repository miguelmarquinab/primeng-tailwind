<div class="px-6 py-3 border border-theme-surface-400 rounded-xl flex flex-col gap-1 cursor-pointer"
     [ngClass]="
                {
                  'shadow-lg bg-primary-sutile border-highlight-focus-background': selected
                }"
>
  <div class="flex justify-between">
    <div class="flex gap-2">
      <img src="shared/images/store-black.svg" alt="" class="w-5"/>
      <span class="font-medium text-sm">{{ destination.office_name }}</span>
    </div>
    <div class="flex gap-2">
      <div class="bg-theme-surface-600 text-white rounded-sm text-[10px] flex items-center px-2.5  h-5">
        @if (!destination.is_agent) {
          <ng-container>Tienda</ng-container>
        }
        @if (destination.is_agent) {
          <ng-container>Agente</ng-container>
        }
      </div>
      @if (!destination.is_open) {
        <div class="bg-theme-surface-600 text-white rounded-sm text-[10px] flex items-center gap-1 px-2.5 h-5">
          <span class="bg-theme-green-400 rounded-full w-1.5 h-1.5"> </span>
          <ng-container>Abierto</ng-container>
        </div>
      }
    </div>
  </div>
  <div class="flex justify-between">
    <div class="flex gap-2">
      <img src="shared/images/marker.svg" alt="" class="w-6"/>
      <span class="font-medium text-theme-text-800 text-sm">{{ destination.office_address }}</span>
    </div>
  </div>

</div>

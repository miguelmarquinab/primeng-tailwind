<div class="flex flex-col bg-white px-8 py-8 sm:px-10 sm:py-10">
    <header class="mb-5 flex shrink-0 items-start justify-between gap-4 sm:mb-6">
        <h2 class="m-0 flex-1 text-left text-xl font-bold leading-7 sm:text-2xl sm:leading-8">¿Regresar al resumen?</h2>
        <button
            type="button"
            class="text-color-secondary -m-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-full transition hover:bg-secondary-sutile focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-theme-secondary"
            (click)="continueEditing()"
            aria-label="Cerrar"
        >
            <i class="pi pi-times text-lg leading-none" aria-hidden="true"></i>
        </button>
    </header>

    <div class="mb-6 flex items-center gap-4 sm:mb-8 sm:gap-5">
        <i class="pi pi-exclamation-triangle text-theme-surface-600 shrink-0 text-9xl leading-none" aria-hidden="true"></i>
        <p class="text-color-main m-0 flex-1 text-sm leading-5 sm:text-base sm:leading-6">Si regresas ahora, perderás los cambios realizados en este envío.</p>
    </div>

    <footer class="flex flex-col gap-3 sm:flex-row sm:justify-end sm:gap-4">
        <p-button type="button" label="Continuar editando" severity="secondary" [outlined]="true" styleClass="w-full sm:w-auto" (click)="continueEditing()" (keydown.enter)="continueEditing()" />
        <p-button type="button" label="Descartar y regresar" severity="primary" styleClass="w-full sm:w-auto" (click)="discardAndReturn()" (keydown.enter)="discardAndReturn()" />
    </footer>
</div>

<div class="flex flex-col gap-3 bg-white border border-surface-200 rounded-2xl p-4 shadow-sm">
    <!-- TOP ROW -->
    <div class="flex justify-between gap-3">
        <!-- LEFT -->
        <div class="flex gap-3 min-w-0">
            <!-- Index + icon -->
            <div class="flex flex-col items-center justify-center gap-1 pr-3 border-r border-surface-200 w-12">
                <span class="font-semibold text-xs text-surface-600 text-color-ultramarine"> #{{ index }} </span>
                <i class="pi pi-box text-lg text-color-ultramarine"></i>
            </div>

            <!-- City + customer -->
            <div class="flex flex-col gap-0.5 min-w-0">
                <span class="font-semibold text-sm text-color-ultramarine">
                    {{ city }}
                </span>
                <span class="text-xs font-semibold text-button-text-plain">
                    {{ customer }}
                </span>

                <!-- TAG (desktop only) -->
                <span class="hidden md:inline-flex mt-1 px-2 py-0.5 rounded-md font-semibold text-xs bg-surface-50 text-primary-700 w-fit text-color-ultramarine"> Entrega a tienda </span>

                <!-- ACTIONS -->
                <div class="flex gap-2 mt-2 flex-wrap md:flex-nowrap">
                    <button class="inline-flex items-center bg-surface-50 gap-1 px-2 py-1 rounded-md text-xs border border-surface-300 text-surface-700 hover:bg-surface-100 cursor-pointer">
                        <i class="pi pi-pen-to-square text-xs"></i>
                        Editar
                    </button>

                    <button class="inline-flex items-center bg-surface-50 gap-1 px-2 py-1 rounded-md text-xs border border-surface-300 text-surface-700 hover:bg-surface-100 cursor-pointer">
                        <i class="pi pi-copy text-xs"></i>
                        Duplicar
                    </button>

                    <button class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs border border-red-200 bg-red-50 text-red-600 hover:bg-red-50 cursor-pointer">
                        <i class="pi pi-trash text-xs"></i>
                        Eliminar
                    </button>
                </div>
            </div>
        </div>

        <!-- DETAILS (desktop only) -->
        <div class="hidden md:flex flex-col gap-2 pl-16 justify-center">
            <div class="flex items-center gap-2 text-xs text-surface-600">
                <i class="pi pi-box text-lg"></i>
                <span class="font-medium">Descripción</span>
                <span class="text-surface-700">
                    {{ description }}
                </span>
            </div>

            <div class="flex items-center gap-2 text-xs text-surface-600">
                <i class="pi pi-map-marker"></i>
                <span class="font-medium">Dirección</span>
                <span class="text-surface-700">
                    {{ address }}
                </span>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="flex flex-col items-center justify-center">
            <span class="text-xs text-surface-500 text-color-ultramarine text-center">Costo envió</span>
            <span class="font-semibold text-xs md:text-sm text-color-ultramarine"> S/. {{ total | number: '1.2-2' }} </span>
        </div>
    </div>
</div>

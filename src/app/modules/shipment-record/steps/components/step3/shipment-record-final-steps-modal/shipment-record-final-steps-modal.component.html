<div class="p-4 flex flex-col gap-4 bg-white rounded-xl">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="text-base font-semibold text-gray-900">Pasos finales</div>

    <button type="button" class="text-gray-500 hover:text-gray-800" (click)="close()">
      <span class="text-xl leading-none">×</span>
    </button>
  </div>

  <!-- Step bar (2 o 3) -->
  <div class="flex gap-2">
    <div class="h-1.5 rounded-full flex-1" [ngClass]="currentStepIndex >= 1 ? 'bg-amber-500' : 'bg-gray-200'"></div>
    <div class="h-1.5 rounded-full flex-1" [ngClass]="currentStepIndex >= 2 ? 'bg-amber-500' : 'bg-gray-200'"></div>

    @if (totalSteps === 3) {
      <div class="h-1.5 rounded-full flex-1" [ngClass]="currentStepIndex >= 3 ? 'bg-amber-500' : 'bg-gray-200'"></div>
    }
  </div>

  <!-- STEP 1: PIN -->
  @if (currentStep === 'PIN') {
    <app-markup-shipment-record-pin-modal
      [embedded]="true"
      (pinSubmitted)="onPinSubmitted($event)">
    </app-markup-shipment-record-pin-modal>
  }

  <!-- STEP 2: AFFIDAVIT -->
  @if (currentStep === 'AFFIDAVIT') {
    <app-shipment-record-declaration-affidavit-modal
      [shipmentsToDeclare]="shipmentsToDeclare"
      (accepted)="onAffidavitAccepted($event)">
    </app-shipment-record-declaration-affidavit-modal>
  }

  <!-- STEP 2/3: PAYMENT -->
  @if (currentStep === 'PAYMENT') {
    <app-payment-method-shipment-record-pin-modal
      [embedded]="true"
      [selectedPaymentMethod]="'niubiz'"
      [paymentAmount]="'S/78.33'"
      [error]="null"
      (paymentConfirmed)="onPaymentConfirmed($event)"
      (goToFinishRequested)="onGoToFinish()">
    </app-payment-method-shipment-record-pin-modal>
  }
</div>

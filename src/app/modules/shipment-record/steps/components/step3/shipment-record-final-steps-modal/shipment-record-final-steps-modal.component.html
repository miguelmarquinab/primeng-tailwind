<div
  class="box-border flex flex-col justify-between p-8 gap-8 w-[627px] max-w-[calc(100vw-2rem)] min-h-[400px] max-h-[min(643.5px,90vh)] bg-white border border-[#E3E9F7] rounded-[26px] shadow-[4px_2px_24.6px_rgba(157,164,191,0.21)]"
>
  <div class="flex flex-col gap-6 flex-1 min-h-0 w-full max-w-[563px] mx-auto">
    <div class="flex items-center justify-between">
      <h2 class="m-0 flex-1 font-bold text-2xl leading-[29px] text-[#494949]">Pasos finales</h2>

      <button
        type="button"
        class="text-gray-500 hover:text-gray-800"
        (click)="close()"
      >
        <span class="text-xl leading-none">×</span>
      </button>
    </div>

    <div class="flex gap-3 w-full">
      <div
        class="flex-1 h-2 rounded-full"
        [ngClass]="currentStepIndex >= 1 ? 'bg-[#FCB414]' : 'bg-[#D9D9D9]'"
      ></div>

      <div
        class="flex-1 h-2 rounded-full"
        [ngClass]="currentStepIndex >= 2 ? 'bg-[#FCB414]' : 'bg-[#D9D9D9]'"
      ></div>

      @if (totalSteps === 3) {
        <div
          class="flex-1 h-2 rounded-full"
          [ngClass]="currentStepIndex >= 3 ? 'bg-[#FCB414]' : 'bg-[#D9D9D9]'"
        ></div>
      }
    </div>

    <div class="flex flex-col gap-6 flex-1 min-h-0 overflow-auto">
      @if (currentStep === 'PIN') {
        <app-markup-shipment-record-pin-modal
          [embedded]="true"
          (pinSubmitted)="onPinSubmitted($event)"
        >
        </app-markup-shipment-record-pin-modal>
      }

      @if (currentStep === 'AFFIDAVIT') {
        <app-shipment-record-declaration-affidavit-modal

          (accepted)="onAffidavitAccepted($event)"
        >
        </app-shipment-record-declaration-affidavit-modal>
      }

      @if (currentStep === 'PAYMENT') {
        <app-payment-method-shipment-record-pin-modal
          [embedded]="true"
          [selectedPaymentMethod]="'niubiz'"
          [paymentAmount]="paymentAmount"
          [error]="null"
          (paymentConfirmed)="onPaymentConfirmed($event)"
          (goToFinishRequested)="onGoToFinish()"
        >
        </app-payment-method-shipment-record-pin-modal>
      }
    </div>
  </div>
</div>
